# Dependabot — 의존성 / GitHub Actions 업데이트 PR 자동 생성.
#
# gradle: 멀티모듈 빌드라도 directory "/" 하나로 루트 build.gradle.kts + 각 모듈
#   build.gradle.kts + gradle-wrapper 까지 한 번에 스캔된다 (version catalog 는 미사용).
# github-actions: ci.yml / codeql.yml 의 actions/* 핀 버전을 갱신.
#
# 주기는 monthly — patch PR noise 를 최소화한다. 한 번에 열리는 PR 수도 5개로 제한.
# groups: 각 ecosystem 의 모든 업데이트를 패턴 "*" 로 묶어 한 달에 PR 하나로만 받는다.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # gradle 의존성 전체를 한 PR 로 모은다 (monthly batched).
      gradle-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # GitHub Actions 업데이트 전체를 한 PR 로 모은다 (monthly batched).
      github-actions-all:
        patterns:
          - "*"

  # docker: 앱 런타임 이미지(infrastructure/Dockerfile) 의 base image 태그 갱신.
  #   eclipse-temurin JRE/JDK 의 패치 릴리스를 추적해 base CVE 를 줄인다.
  #   wiremock/auth-stub 등 테스트 전용 Dockerfile 은 운영 영향이 없어 제외.
  - package-ecosystem: "docker"
    directory: "/infrastructure"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # docker base image 업데이트 전체를 한 PR 로 모은다 (monthly batched).
      docker-all:
        patterns:
          - "*"
