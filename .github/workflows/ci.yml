name: CI

# main 으로의 push 와 main 대상 PR 에서 자동 검증한다. 수동 실행도 함께 허용.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 ref(브랜치/PR) 에 새 push 가 들어오면 진행 중 run 을 취소해 러너 낭비를 막는다.
# main push 는 배포 신뢰성을 위해 취소하지 않는다 (github.ref 를 키에 포함).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 최소 권한 원칙 — 기본은 읽기만. SARIF 업로드 job 에서만 security-events: write 를 추가한다.
permissions:
  contents: read

jobs:
  test:
    name: Build + Unit + Slice tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Build + test (excluding e2e)
        run: ./gradlew test -x :e2e-tests:test --no-daemon
      - name: Modulith verify (도메인 경계 검증)
        run: ./gradlew :market-bootstrap:test --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  e2e:
    name: e2e Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: e2e (Postgres Testcontainer)
        run: ./gradlew :e2e-tests:test --no-daemon
      - name: Upload e2e reports (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-reports
          path: |
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**

  static-analysis:
    name: Static analysis (Kotlin compile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: ./gradlew compileJava compileKotlin --no-daemon

  quality:
    name: ktlint + coverage (Kover)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: ktlint (Kotlin lint)
        run: ./gradlew ktlintCheck --no-daemon
      - name: Coverage report (Kover, e2e 제외)
        run: ./gradlew koverXmlReport koverHtmlReport -x :e2e-tests:test --no-daemon
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kover-coverage
          path: |
            build/reports/kover/html/**
            build/reports/kover/report.xml

  image:
    name: Docker image build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # SARIF 를 Security > Code scanning 탭에 업로드하기 위한 최소 권한.
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Build bootJar
        run: ./gradlew :market-bootstrap:bootJar --no-daemon
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image
        run: |
          docker build -t bid-ask-marketplace:${{ github.sha }} \
            --build-arg VCS_REF="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VERSION="${{ github.ref_name }}" \
            -f infrastructure/Dockerfile .
      # 게이트 스캔 — fixable CRITICAL/HIGH 가 있으면 빌드를 실패시킨다 (운영 게이트 유지).
      - name: Trivy scan (gate)
        # @master 같은 mutable ref 는 공급망 취약점 — SHA 로 고정.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: bid-ask-marketplace:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      # 리포팅 스캔 — 게이트와 별개로 SARIF 를 생성해 Security 탭에 누적한다.
      # unfixed 까지 포함해 전체 그림을 남기되, 업로드 실패가 빌드를 막지 않도록 한다.
      - name: Trivy scan (SARIF report)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: bid-ask-marketplace:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: false
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@181d5eefc20863364f96762470ba6f862bdef56b # v3.29.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  helm:
    name: Helm lint + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.19.0
      - name: Install kubeconform
        run: |
          KC_VERSION=v0.6.7
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KC_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      # dev / prod 두 values 프로필 모두 렌더가 유효한지 검증.
      - name: helm lint (dev + prod)
        run: |
          helm lint helm/resell-orderbook -f helm/resell-orderbook/values.yaml
          helm lint helm/resell-orderbook -f helm/resell-orderbook/values-prod.yaml
      # 렌더 결과를 K8s 스키마로 검증. CRD(ServiceMonitor 등)는 미설치 스키마로 건너뛴다.
      - name: helm template | kubeconform (dev + prod)
        run: |
          for VALUES in values.yaml values-prod.yaml; do
            echo "::group::kubeconform ${VALUES}"
            helm template t helm/resell-orderbook -f "helm/resell-orderbook/${VALUES}" \
              | kubeconform -strict -ignore-missing-schemas -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
