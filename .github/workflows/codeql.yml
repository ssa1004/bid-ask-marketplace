name: CodeQL

# Java/Kotlin SAST. production 코드는 전 모듈 Kotlin, 테스트만 Java/Kotlin 혼용이라
# language 는 java-kotlin 하나로 양쪽을 함께 분석한다.
#
# main 으로의 push / PR 마다 SAST 를 돌리고, 주 1회 스케줄로 정기 스캔도 유지한다.
# 필요 시 workflow_dispatch 로 즉시 실행한다.
on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 03:00 UTC — dependabot weekly 와 같은 날.
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 PR 에 새 push 가 들어오면 진행 중 분석을 취소 (PR 한정). main/schedule 은 유지.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 기본은 읽기만. 결과 업로드 권한은 analyze job 에서 명시한다.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # CodeQL 결과를 Security 탭에 업로드하기 위한 최소 권한.
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21', cache: gradle }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@181d5eefc20863364f96762470ba6f862bdef56b # v3.29.2
        with:
          languages: java-kotlin
          # Gradle 멀티모듈이라 자동 빌드 추론이 불안정 — 명시 빌드 단계를 둔다.
          build-mode: manual

      - name: Build (compile only)
        # CodeQL manual build-mode 는 컴파일러가 실제로 돌아야 소스를 추출한다.
        # org.gradle.caching=true + setup-java 의 gradle 캐시 때문에 compile 태스크가
        # FROM-CACHE 로 끝나면 추출할 소스가 없어 database finalize 가 exit 32 로 실패한다.
        # --no-build-cache --rerun-tasks 로 매번 강제로 재컴파일한다.
        run: ./gradlew compileJava compileKotlin --no-daemon --no-build-cache --rerun-tasks

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@181d5eefc20863364f96762470ba6f862bdef56b # v3.29.2
        with:
          category: "/language:java-kotlin"
